name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  PACKAGE_VERSION: 0.1.2-preview.1

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-2025
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: bash scripts/build-native.sh --rid ${{ matrix.rid }}
        shell: bash
      # Database cases run in the Linux integration job; the header test assumes upstream's go/ sibling.
      - run: cargo test --locked --manifest-path artifacts/native-source/crate/Cargo.toml -p stampeded-ffi --test rules
        shell: bash
      - run: dotnet restore Stampeded.slnx
      - run: dotnet build Stampeded.slnx -c Release --no-restore
      - run: dotnet format Stampeded.slnx --verify-no-changes --no-restore
      # Database cases run in the Linux integration job below; native cases run on all hosts.
      - run: dotnet test --solution Stampeded.slnx -c Release --no-build
      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.rid }}
          path: runtimes/**
          if-no-files-found: error

  integration:
    needs: native
    runs-on: ubuntu-24.04
    services:
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: stampeded
          POSTGRES_USER: stampeded
          POSTGRES_PASSWORD: stampeded
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stampeded -d stampeded"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      STAMPEDED_TEST_DATABASE_URL: postgres://stampeded:stampeded@localhost:5432/stampeded
      STAMPEDED_CC: gcc-14
      STAMPEDED_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=stampeded;Username=stampeded;Password=stampeded
      STAMPEDED_REQUIRE_DATABASE_TESTS: 1
      STAMPEDED_TEST_MAILPIT_URL: http://localhost:8025
      STAMPEDED_TEST_SMTP_HOST: localhost
      STAMPEDED_TEST_SMTP_PORT: 1025
      STAMPEDED_REQUIRE_WORKLOAD_TESTS: 1
      STAMPEDED_REQUIRE_TLS_TESTS: 1
      STAMPEDED_TEST_ARTIFACTS: ${{ github.workspace }}/artifacts/workloads
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: bash scripts/prepare-native.sh
        shell: bash
      - run: cargo test --locked --manifest-path artifacts/native-source/crate/Cargo.toml -p stampeded-ffi --test c_abi --test connect
        shell: bash
      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: runtimes
          merge-multiple: true
      - name: Enable PostgreSQL TLS with a private test CA
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          certificate_directory="$RUNNER_TEMP/stampeded-tls"
          bash scripts/configure-test-postgres-tls.sh "$POSTGRES_CONTAINER" "$certificate_directory"
          echo "STAMPEDED_TEST_TLS_ROOT_CERT=$certificate_directory/ca.crt" >> "$GITHUB_ENV"
      - run: bash scripts/verify-upstream.sh
        shell: bash
      - run: dotnet restore Stampeded.slnx
      - run: dotnet build Stampeded.slnx -c Release --no-restore
      - run: dotnet test --solution Stampeded.slnx -c Release --no-build
      - run: dotnet pack src/Stampeded/Stampeded.csproj -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/Stampeded.Hosting/Stampeded.Hosting.csproj -c Release --no-build -o artifacts/packages
      - run: bash scripts/verify-package.sh artifacts/packages/Stampeded.NET.${PACKAGE_VERSION}.nupkg
        shell: bash
      - uses: actions/upload-artifact@v6
        with:
          name: nuget-preview
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: workload-evidence
          path: artifacts/workloads/**
          if-no-files-found: ignore

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: integration
    runs-on: ubuntu-24.04
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v7
        with:
          name: nuget-preview
          path: artifacts/packages
      - name: Obtain a short-lived NuGet publishing key
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: mourad_12
      - name: Publish core, then hosting
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/packages/Stampeded.NET.${PACKAGE_VERSION}.nupkg" \
            --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
          dotnet nuget push "artifacts/packages/Stampeded.NET.Hosting.${PACKAGE_VERSION}.nupkg" \
            --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
