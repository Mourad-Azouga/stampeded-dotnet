[package]
name = "stampeded-ffi"
description = "C ABI connector for Stampeded.NET"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "BSD-3-Clause"
repository = "https://github.com/Mourad-Azouga/stampeded-dotnet"
authors = ["Abdelkader Boudih"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["tls-aws-lc"]
tls-aws-lc = ["stampeded/tls-aws-lc"]
tls-ring = ["stampeded/tls-ring"]

[dependencies]
stampeded = { version = "0.4", default-features = false }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "macros"] }
serde_json = "1"
uuid = { version = "1.28", features = ["v7", "serde"] }
jiff = { version = "0.2", features = ["serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
cbindgen = { version = "0.29", default-features = false }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"
